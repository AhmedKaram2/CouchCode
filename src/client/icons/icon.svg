<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Terminal window -->
  <rect x="64" y="96" width="384" height="320" rx="24" fill="none" stroke="#4CAF50" stroke-width="16"/>

  <!-- Title bar dots -->
  <circle cx="112" cy="144" r="12" fill="#ff5555"/>
  <circle cx="160" cy="144" r="12" fill="#f1fa8c"/>
  <circle cx="208" cy="144" r="12" fill="#50fa7b"/>

  <!-- Command prompt -->
  <path d="M112 240 L176 304 L112 368" fill="none" stroke="#50fa7b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor line -->
  <line x1="224" y1="340" x2="400" y2="340" stroke="#8be9fd" stroke-width="16" stroke-linecap="round"/>
</svg>
